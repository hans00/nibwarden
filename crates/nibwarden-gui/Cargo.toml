[package]
name = "nibwarden-gui"
description = "nibwarden-gui: the main window, quick access, settings, tray icon, and the unlock and approval windows nibwardend opens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Item history dates in local time.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
nibwarden-config = { workspace = true }
nibwarden-ipc = { workspace = true }
nibwarden-platform = { workspace = true, features = ["clipboard", "tray"] }
# Reading a one-time code's QR code from a screenshot or an image file.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Choosing a key or image file: the desktop portal on Linux, the native dialog elsewhere.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
rqrr = "0.11"
# `unstable-winit-030`: files dropped on the window (winit has them, Slint does not yet).
slint = { workspace = true, features = ["unstable-winit-030"] }
tokio = { workspace = true, features = ["io-std", "io-util", "rt", "sync", "time"] }
tracing = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The screenshot portal, for scanning the screen.
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
url = "2"

[dev-dependencies]
png = "0.18"
# Draws a QR code for the scanning test.
qrcode = { version = "0.14", default-features = false, features = ["image"] }

[build-dependencies]
slint-build = { workspace = true }
