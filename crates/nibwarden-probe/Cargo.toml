[package]
name = "nibwarden-probe"
description = "Test tool for scripts/e2e.sh: sets up accounts and test data through nibwarden-core, as a second device, and acts as the browser extension."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
# Writes a KeePass database for the import test (the version the SDK importer reads).
keepass = { version = "0.14", default-features = false, features = ["save_kdbx4"] }
nibwarden-core = { workspace = true }
reqwest = { workspace = true }
rpassword = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process"] }
tracing-subscriber = { workspace = true }
