[package]
name = "nibwarden-daemon"
description = "nibwardend: holds the unlocked vault and serves the control socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "nibwardend"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
# Website icons go to the GUI as base64.
base64 = "0.22"
futures-util = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
nibwarden-config = { workspace = true }
nibwarden-core = { workspace = true }
nibwarden-ipc = { workspace = true }
nibwarden-platform = { workspace = true }
nibwarden-ssh-agent = { workspace = true }
rmpv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }
