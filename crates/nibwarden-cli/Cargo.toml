[package]
name = "nibwarden-cli"
description = "nibwarden: command-line client for nibwardend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "nibwarden"
path = "src/main.rs"

[[bin]]
name = "nibwarden-ssh-sign"
path = "src/bin/ssh_sign.rs"

[[bin]]
name = "nibwarden-browser-host"
path = "src/bin/browser_host.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
nibwarden-config = { workspace = true }
nibwarden-ipc = { workspace = true }
nibwarden-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "sync", "time"] }
zeroize = { workspace = true }
