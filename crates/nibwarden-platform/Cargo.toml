[package]
name = "nibwarden-platform"
description = "Platform layer (phase2.md §8): everything OS-specific. Linux is implemented; other targets compile and report Unsupported."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# The GUI's clipboard; kept out of the daemon.
clipboard = ["dep:arboard"]
# The GUI's tray icon.
tray = ["dep:ksni"]

[dependencies]
rpassword = { workspace = true }
# Native messaging host manifests.
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "process", "signal", "sync"] }
tracing = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { workspace = true, optional = true }
futures-util = { workspace = true }
ksni = { version = "0.3", optional = true }
libc = { workspace = true }
# Asking EGL whether OpenGL works, before the GUI picks its renderer.
libloading = "0.8"
zbus = { workspace = true }

[[example]]
name = "clipboard-check"
required-features = ["clipboard"]

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync"] }
