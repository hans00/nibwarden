[package]
name = "nibwarden-platform"
description = "Platform layer (phase2.md §8): everything OS-specific. Linux is implemented; other targets compile and report Unsupported."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# The GUI's clipboard; kept out of the daemon.
clipboard = ["dep:arboard"]
# The GUI's tray icon.
tray = ["dep:ksni", "dep:tray-icon", "dep:dispatch2", "dep:objc2-app-kit", "dep:windows-sys"]

[dependencies]
arboard = { workspace = true, optional = true }
rpassword = { workspace = true }
# Native messaging host manifests.
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "process", "signal", "sync"] }
tracing = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { workspace = true }
ksni = { version = "0.3", optional = true }
# Asking EGL whether OpenGL works, before the GUI picks its renderer.
libloading = "0.8"
zbus = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The tray icon; on Linux ksni instead (tray-icon would need GTK there).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = { version = "0.26", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"
core-foundation-sys = "0.8"
# The tray's main loop (main_thread.rs): AppKit's events and the main queue.
dispatch2 = { version = "0.3", optional = true }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSError", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSString"] }
# System authentication (Touch ID or the login password).
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "block2", "LAContext", "LAError", "LAPublicDefines"] }

[target.'cfg(windows)'.dependencies]
# The tray's main loop (main_thread.rs) and the taskbar's theme.
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[[example]]
name = "clipboard-check"
required-features = ["clipboard"]

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync"] }
