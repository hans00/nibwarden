name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Checks (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev gettext
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check
      - name: Translations
        run: for po in crates/nibwarden-gui/lang/*/LC_MESSAGES/*.po; do msgfmt -c -o /dev/null "$po"; done

  platforms:
    # nibwarden runs on Linux only so far; the other platforms' stubs must keep compiling,
    # so no Linux-only type leaks into the shared interfaces.
    name: Compiles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  e2e:
    name: End to end (Vaultwarden)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev jq openssh-client openssh-server
      - uses: Swatinem/rust-cache@v2
      - run: scripts/e2e.sh
