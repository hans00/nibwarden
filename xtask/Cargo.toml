[package]
name = "xtask"
description = "Project tasks for nibwarden: `cargo xtask check`, `install` and `dist`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
ar = "0.9.0"
clap = { workspace = true, features = ["derive"] }
flate2 = "1.1.11"
# Only what writing a gzip-compressed, unsigned rpm needs.
rpm = { version = "0.30.2", default-features = false, features = ["payload", "gzip-compression"] }
sha2 = "0.11.1"
tar = "0.4.46"
